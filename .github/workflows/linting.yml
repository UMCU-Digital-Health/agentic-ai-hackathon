name: Linting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: linting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Analysing the code with ruff
      run: |
        uvx ruff check .